syntax = "proto3";

package EsPb;

enum eBattleBufferType {
  UseUltimate = 0;
  UseActive = 1;
  AutoBattle = 2;
  AutoUltimate = 3;
  UltimatePriority = 4;
}

message sBattleSkill {
  string heroIdx = 1;
  int64 frame = 2;
  bool flag = 3;
  eBattleBufferType battleBuffType = 4;
  repeated sHeroActionPriority heroActionPriority = 5;
}

message sHeroActionPriority {
  int32 heroNo = 1;
  int32 priority = 2;
}

