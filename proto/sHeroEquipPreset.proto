syntax = "proto3";

package EsPb;

message sHeroEquipPreset {
  sHeroEquipPresetSlot presetSlot = 1;
  repeated sHeroEquipPresetHero presetHero = 2;
}

message sHeroEquipPresetSlot {
  int32 slot = 1;
  string name = 2;
}

message sHeroEquipPresetHero {
  string heroIdx = 1;
  repeated sHeroEquipPresetItemSlot itemSlot = 2;
}

message sHeroEquipPresetItemSlot {
  int32 slot = 1;
  int32 itemEquipId = 2;
}

