syntax = "proto3";

package EsPb;

message sHeroEquipAndItemInfoAll {
  string heroIdx = 1;
  repeated sSlotAndEquipItem slotAndEquipItem = 2;
  sItemSignature signature = 3;
}

message sSlotAndEquipItem {
  int32 slot = 1;
  sItemEquip itemEquip = 2;
}

message sItemEquip {
  int64 id = 1;
  int32 itemNo = 2;
  int32 exp = 3;
}

message sItemSignature {
  int32 itemNo = 1;
  int32 grade = 2;
  int32 level = 3;
}

