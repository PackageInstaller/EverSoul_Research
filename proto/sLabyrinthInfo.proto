syntax = "proto3";

package EsPb;

message sLabyrinthInfo {
  bool isPlaying = 1;
  int32 currentLabyrinthNo = 2;
  bytes currentAdditionalInfo = 3;
  int32 maxClearFloor = 4;
  int32 isClear = 5;
  int32 isSweep = 6;
  int32 maxLabyrinthNo = 7;
  int32 labyrinthClearCnt = 8;
  int32 labyrinthTicketCnt = 9;
  bool isLabyrinthOpen = 10;
}

