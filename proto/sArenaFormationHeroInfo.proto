syntax = "proto3";

package EsPb;

message sArenaFormationHeroInfo {
  string heroIdx = 1;
  string originalHeroIdx = 2;
  int32 heroNo = 3;
  int32 level = 4;
  int32 gradeSno = 5;
  int32 power = 6;
  int32 raceSno = 7;
  repeated sSlotAndEquipItem slotAndEquipItem = 8;
  sItemSignature signature = 9;
  int32 costumeItemNo = 10;
  repeated sHeroOption heroOption = 11;
}

message sSlotAndEquipItem {
  int32 slot = 1;
  sItemEquip itemEquip = 2;
}

message sItemEquip {
  int64 id = 1;
  int32 itemNo = 2;
  int32 exp = 3;
}

message sItemSignature {
  int32 itemNo = 1;
  int32 grade = 2;
  int32 level = 3;
}

message sHeroOption {
  int32 heroNo = 1;
  int32 groupNo = 2;
  int32 optionSlot = 3;
  int32 optionNo = 4;
  int32 optionValue = 5;
  int32 optionType = 6;
  int32 optionLock = 7;
}

