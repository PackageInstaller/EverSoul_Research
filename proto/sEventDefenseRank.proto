syntax = "proto3";

package EsPb;

message sEventDefenseRank {
  int32 rank = 1;
  string userIdx = 2;
  int64 score = 3;
  string nickName = 4;
  sThumbnail thumbnail = 5;
}

message sThumbnail {
  int32 thumbnailFrame = 1;
  int32 thumbnailImage = 2;
  bool useCustom = 3;
  bytes thumbnail = 4;
}

